# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  Tests:

    runs-on: ubuntu-latest

    steps:
    - name: Respository Checkout
      uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        
    - name: Install dependencies
      run: pip install poetry && poetry install
      
    - name: Run Unit Test
      run: poetry run pytest -v tests/unit_tests/

    - name: Run BlueSky Test
      env: 
        BLUESKY_PRINCIPAL_NAME: ${{secrets.BLUESKY_PRINCIPAL_NAME}}
        BLUESKY_PRINCIPAL_API_KEY: ${{secrets.BLUESKY_PRINCIPAL_API_KEY}}
      run: poetry run pytest -v tests/integration_tests/test_bluesky_API.py::test_bluesky_connection_atprotocol_error
      
    - name: Run Twitter Test
      env: 
        TWITTER_BEARER_TOKEN: ${{secrets.TWITTER_BEARER_TOKEN}}
        
        TWITTER_PRIMARY_CUSTOMER_2_KEY: ${{secrets.TWITTER_PRIMARY_CUSTOMER_2_KEY}}
        TWITTER_PRIMARY_CUSTOMER_2_SECRET_KEY: ${{secrets.TWITTER_PRIMARY_CUSTOMER_2_SECRET_KEY}}
        
        TWITTER_PRIMARY_API_KEY: ${{secrets.TWITTER_PRIMARY_API_KEY}}
        TWITTER_PRIMARY_API_SECRET_KEY: ${{secrets.TWITTER_PRIMARY_API_SECRET_KEY}}
        TWITTER_PRIMARY_ACCESS_TOKEN: ${{secrets.TWITTER_PRIMARY_ACCESS_TOKEN}}
        TWITTER_PRIMARY_ACCESS_TOKEN_SECRET: ${{secrets.TWITTER_PRIMARY_ACCESS_TOKEN_SECRET}}    
      run: poetry run pytest -v tests/integration_tests/test_twitter_API.py::test_twiiter_connection
