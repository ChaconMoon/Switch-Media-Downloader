# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Run Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  Tests:

    runs-on: ubuntu-latest

    steps:
    - name: Respository Checkout
      uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        
    - name: Install dependencies
      run: pip install poetry && poetry install
      
    - name: Run Unit Test
      run: poetry run pytest -v tests/unit_tests/

    - name: Run Download Test
      run: poetry run pytest -v tests/integration_tests/test_downloads.py

    - name: Run BlueSky Test
      env: 
        BLUESKY_SECUNDARY_NAME: ${{secrets.BLUESKY_SECUNDARY_NAME}}
        BLUESKY_SECUNDARY_API_KEY: ${{secrets.BLUESKY_SECUNDARY_API_KEY}}
      run: poetry run pytest -v tests/integration_tests/test_bluesky_API.py
      
    - name: Run Twitter Test
      env: 
        TWITTER_BEARER_TOKEN_TESTS: ${{secrets.TWITTER_BEARER_TOKEN_TESTS}}
        
        TWITTER_PRIMARY_CUSTOMER_2_KEY_TESTS: ${{secrets.TWITTER_PRIMARY_CUSTOMER_2_KEY_TESTS}}
        TWITTER_PRIMARY_CUSTOMER_2_SECRET_KEY_TESTS: ${{secrets.TWITTER_PRIMARY_CUSTOMER_2_SECRET_KEY_TESTS}}
        
        TWITTER_PRIMARY_API_KEY_TESTS: ${{secrets.TWITTER_PRIMARY_API_KEY_TESTS}}
        TWITTER_PRIMARY_API_SECRET_KEY_TESTS: ${{secrets.TWITTER_PRIMARY_API_SECRET_KEY_TESTS}}
        TWITTER_PRIMARY_ACCESS_TOKEN_TESTS: ${{secrets.TWITTER_PRIMARY_ACCESS_TOKEN_TESTS}}
        TWITTER_PRIMARY_ACCESS_TOKEN_SECRET_TESTS: ${{secrets.TWITTER_PRIMARY_ACCESS_TOKEN_SECRET_TESTS}}    
      run: poetry run pytest -v tests/integration_tests/test_twitter_API.py
    
