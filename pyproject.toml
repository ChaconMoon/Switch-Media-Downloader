[tool.poetry]
name = "switch-screenshot-downloader"
version = "0.1.0"
description = ""
authors = ["Carlos Chacón <chaconmooncarlos@gmail.com>"]
readme = "README.md"

packages = [
    {include = "src", from = "Switch_ScreenShot_Downloader"},
    {include = "APIs", from = "src"},
    {include = "controllers", from = "src"},
    {include = "switch", from = "src"},
    {include = "tests"}
]
[tool.poetry.dependencies]
python = "3.12.5"
pywifi = "1.1.12"
comtypes = "1.4.9"
requests = "2.32.3"
selenium = "4.28.1"
atproto = "0.0.58"
python-dotenv = "1.0.1"
ruff = "0.9.4"
pytest = "8.3.4"
tweepy = "^4.15.0"

[tool.pytest.ini_options]
pythonpath = [
  "src"
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
