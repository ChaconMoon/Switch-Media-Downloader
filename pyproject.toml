[project]
name = "switch-media-downloader"
version = "0.1.0"
description = "A Nintendo Switch screenshot and video downloader"
authors = [
  {name = "Carlos Chacón", email = "chaconmooncarlos@gmail.com"}]
readme = "README.md"
requires-python = ">=3.12.5, <=3.13"

packages = [
    {include = "APIs", from = "switch-media-downloader"},
    {include = "controllers", from = "switch-media-downloader"},
    {include = "switch", from = "switch-media-downloader"},
    {include = "tests", from = "."}
]
include = [
  ".env_example",
]
dependencies = [
"pywifi (==1.1.12)",
"comtypes (==1.4.9)",
"requests (==2.32.3)",
"selenium (==4.28.1)",
"atproto (==0.0.58)",
"python-dotenv (==1.0.1)",
"ruff (==0.9.4)",
"pytest (==8.3.4)",
"tweepy @ https://github.com/tweepy/tweepy/archive/db28c0e84826485755eb7fcef0c30f75395dff5f.zip",
"pyfakefs (>=5.7.4,<6.0.0)",
"mastodon-py (>=2.0.1,<3.0.0)"
]

[tool.pytest.ini_options]
pythonpath = [
  "switch_media_downloader"
]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
