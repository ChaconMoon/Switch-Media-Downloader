[project]
name = "switch-media-downloader"
version = "0.1.0"
description = "A Nintendo Switch screenshot and video downloader"
authors = [
  {name = "Carlos Chacón", email = "chaconmooncarlos@gmail.com"}]
readme = "README.md"
requires-python = ">=3.12.5, <=3.13"

packages = [
    {include = "APIs", from = "switch-media-downloader"},
    {include = "controllers", from = "switch-media-downloader"},
    {include = "switch", from = "switch-media-downloader"},
    {include = "tests", from = "."}
]
include = [
  ".env_example",
]
dependencies = [
"pywifi (==1.1.12)",
"comtypes (==1.4.9)",
"requests (==2.32.3)",
"selenium (==4.28.1)",
"atproto (==0.0.58)",
"python-dotenv (==1.0.1)",
"ruff (==0.9.4)",
"pytest (==8.3.4)",
"tweepy @ https://github.com/tweepy/tweepy/archive/db28c0e84826485755eb7fcef0c30f75395dff5f.zip",
"pyfakefs (>=5.7.4,<6.0.0)",
"mastodon-py (>=2.0.1,<3.0.0)"
]

[tool.pytest.ini_options]
pythonpath = [
  "switch_media_downloader"
]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 90
indent-width = 8
# exclude = ["tests"]
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "D"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "D",
  "W2",
  "W391",
  "W505",
  "I",
  "UP006",
  "UP007",
  "UP008",
  "UP015",
  "UP032",
  "UP035",
  "UP037",
  "UP039",
  "UP042",
  "S",
  "BLE",
  "FBT",
  "B",
  "A",     # Keywords shadowing
  "COM",   # Trailing commas
  "C4",    # List comprehensions
  "DTZ",   # Datetime
  "ISC",   # Implicit string concatenation
  "ICN",   # Import conventions
  "LOG",   # Logging rules
  "G",     # Logging rules
  "PIE",   # Avoid unnecessary code
  "T20",   # Do not use print or pprint
  "PYI",
  "PT",
  "Q",
  "RSE",
  "RET",
  "SLF",
  "SIM",
  "SLOT",
  "TID",
  "TD",
  "ARG",
  "PTH",
  "FLY",
  "C90",
  "N",
  "PERF",
  "W",
]

ignore = [
  "D203",   # Empty line between class declaration and docstring
  "D212",   # Docstring summary in first line
  "ICN003", # Prohibit 'from' in import
  "COM812", # Conflict with ISC001 | Checks for absensce of trailing commas
  "TD002",
  "TD003",
  "FBT001",
  "SIM108",
  "T201",
]